{{- /* GA4 转化事件：WhatsApp / 邮件 / 电话点击 + 表单提交 */ -}}
{{ with .Site.Params.googleAnalytics }}
<script>
(function () {
  if (typeof window.gtag !== 'function') return;
  function send(name, params) {
    try { window.gtag('event', name, params); } catch (e) {}
  }
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a') : null;
    if (!a) return;
    var href = a.getAttribute('href') || '';
    var cls = a.className || '';
    var p = {
      link_url: href.slice(0, 180),
      link_text: (a.textContent || '').trim().slice(0, 60),
      page_path: location.pathname
    };
    if (href.indexOf('wa.me') > -1 || href.indexOf('api.whatsapp.com') > -1) {
      p.placement = cls.indexOf('whatsapp-float') > -1 ? 'float_button'
        : (cls.indexOf('share-') > -1 ? 'share' : 'inline');
      send('whatsapp_click', p);
    } else if (href.indexOf('mailto:') === 0) {
      send('email_click', p);
    } else if (href.indexOf('tel:') === 0) {
      send('phone_click', p);
    }
  }, true);
  document.addEventListener('submit', function (e) {
    var f = e.target || {};
    send('lead_form_submit', {
      form_id: f.id || f.name || 'contact_form',
      page_path: location.pathname
    });
  }, true);
})();
</script>
{{ end }}
