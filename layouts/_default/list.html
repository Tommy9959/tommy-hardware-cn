{{ define "main" }}
<section style="padding: 3rem 0; background: white;">
    <div class="container">
        <h1 style="font-size: 2rem; margin-bottom: 1rem; text-align: center;">{{ .Title }}</h1>
        {{ with .Description }}<p style="text-align: center; color: #666; margin-bottom: 2rem;">{{ . }}</p>{{ end }}
        <div style="max-width: 900px; margin: 0 auto; line-height: 1.8; color: #333;">
            {{ .Content }}
        </div>
    </div>
</section>
{{ end }}
