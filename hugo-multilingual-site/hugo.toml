# Markdown 配置
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# SEO 优化配置
[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.8
  disable = false

# 输出配置
[outputs]
  home = ['HTML', 'RSS', 'JSON']
  page = ['HTML']
  section = ['HTML', 'RSS']

# 性能优化 - 压缩配置
[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepComments = false
      keepSpecialComments = false
      minifyCSS = true
      minifyJS = true
    [minify.tdewolff.css]
      precision = 2
    [minify.tdewolff.js]
      keepVarNames = false
      precision = 0
      version = 2022

