# Hugo 多语言网站配置文件
baseURL = 'https://jh-hardware.com/'
languageCode = 'zh-cn'
title = 'JH HARDWARE | 钧瀚五金 - 工厂直销尼日利亚·非洲'

# 默认语言为英文
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

# 禁用空标签/分类页面（避免产生404）
disableKinds = ["taxonomy", "term"]
disableAliases = true

# 多语言配置
[languages]
  [languages.en]
    title = 'JH HARDWARE | Factory Direct Hardware to Nigeria & Africa'
    weight = 1
    languageName = 'English'
    languageCode = 'en-us'
    contentDir = 'content/en'
    description = 'Factory direct supply of door handles, locks, hinges, and sliding tracks. ISO 9001 certified manufacturer. Export to Nigeria, Dubai, Africa.'
    
  [languages.zh]
    title = 'JH HARDWARE | 钧瀚五金 - 工厂直销尼日利亚·非洲'
    weight = 2
    languageName = '中文'
    languageCode = 'zh-cn'
    contentDir = 'content/zh'
    description = 'SOLA门控五金 — 中国工厂直销门把手、门锁、门铰链、滑动轨。ISO 9001认证。10年尼日利亚出口经验，提供Form M/SONCAP全套文件支持。批发价格，15-25天交货，免费样品。'
    
  [languages.ar]
    title = 'JH HARDWARE | أجهزة الأبواب والمباني | بيع مباشر لنيجيريا وأفريقيا' 
    weight = 3
    languageName = 'العربية'
    languageCode = 'ar'
    contentDir = 'content/ar'
    languageDirection = 'rtl'
    description = 'توريد مباشر من المصنع لمقابض الأبواب، والمفاصل، والأقفال، والمسارات المنزلقة. تصنيع مهني لعتاد الأبواب.'

