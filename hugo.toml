# Hugo 多语言网站配置文件
baseURL = 'https://jh-hardware.com/'
languageCode = 'zh-cn'
title = '义乌水汇进出口有限公司 - 专业门控五金制造商'

# 默认语言为英文
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

# 禁用空标签/分类页面（避免产生404）
disableKinds = ["taxonomy", "term"]

# 多语言配置
[languages]
  [languages.en]
    title = 'Yiwu Shuihui Import & Export Co., Ltd. - Professional Door Hardware Manufacturer'
    weight = 1
    languageName = 'English'
    languageCode = 'en-us'
    contentDir = 'content/en'
    description = 'Factory direct supply of door handles, hinges, locks, and sliding tracks. ISO 9001 certified manufacturer. Export to Nigeria, Dubai, Africa.'
    
  [languages.zh]
    title = '义乌水汇进出口有限公司 - 专业门控五金制造商'
    weight = 2
    languageName = '中文'
    languageCode = 'zh-cn'
    contentDir = 'content/zh'
    description = '工厂直销门把手、铰链、门锁、导轨。ISO 9001 认证制造商。出口尼日利亚、迪拜、非洲。'
    
  [languages.ar]
    title = 'شركة ييو شويهوي للاستيراد والتصدير - تصنيع مهني لعتاد الأبواب'
    weight = 3
    languageName = 'العربية'
    languageCode = 'ar'
    contentDir = 'content/ar'
    languageDirection = 'rtl'
    description = 'توريد مباشر من المصنع لمقابض الأبواب، والمفاصل، والأقفال، والمسارات المنزلقة. تصنيع مهني لعتاد الأبواب.'

