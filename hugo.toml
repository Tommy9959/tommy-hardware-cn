# Markdown 配置
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# SEO 优化配置 — Hugo v0.160 默认输出 sitemapindex（en/zh/ar 子sitemap）
# Google 原生支持 sitemapindex，不需要拼回扁平
[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.9

# 精确控制sitemap中哪些页面类型出现
[mediaTypes]
  [mediaTypes.'application/sitemap']
    suffixes = ['xml']

# 搜索引擎验证
[verification]
  google = 'G-EW8MR1LQWY'  # Google Search Console 验证（使用 Analytics ID 临时）
  bing = ''  # 待添加 Bing 站长工具验证

# 社交媒体 SEO
[social]
  twitter = ''
  facebook = ''
  linkedin = ''
  instagram = ''

# 输出配置
[outputs]
  home = ['HTML', 'RSS', 'JSON']
  page = ['HTML']
  section = ['HTML', 'RSS']
  llms = ['TXT']

# 自定义输出格式
[outputFormats]
  [outputFormats.TXT]
    name = 'TXT'
    baseName = 'llms'
    path = '/'
    mediaType = 'text/plain'
    isPlainText = true
    isHTML = false
    rel = 'alternate'
    permalinkable = false

# 性能优化 - 压缩配置
[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepComments = false
      keepSpecialComments = false
      minifyCSS = true
      minifyJS = true
    [minify.tdewolff.css]
      precision = 2
    [minify.tdewolff.js]
      keepVarNames = false
      precision = 0
      version = 2022

# 禁用分类和标签避免空页面
taxonomies = []
